<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Place Value Duel</title>
  <style>
    :root {
      /* Dark Mode (Default / Wordle) */
      --bg: #121213;
      --card-bg: #1a1a1c;
      --border-color: #3a3a3c;
      --text: #ffffff;
      --text-muted: #818384;
      --faded-text: #565758;
      
      --same-green: #538d4e;      /* Wordle Green */
      --diff-red: #b53737;        /* Wordle Red/Coral variant */
      --accent: #b59f3b;          /* Wordle Amber/Yellow */
      --btn-active: #2a2a2c;
      
      --divider-dashed: #3a3a3c;
      --panel-bg: #1e1e20;
    }

    [data-theme="light"] {
      /* High-quality Light Mode matching Wordle Light */
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --faded-text: #cbd5e1;

      --same-green: #6aaa64;
      --diff-red: #ea580c;
      --accent: #c9b458;
      --btn-active: #f1f5f9;

      --divider-dashed: #cbd5e1;
      --panel-bg: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      touch-action: manipulation;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .top-controls {
      display: flex;
      gap: 8px;
    }

    .header-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .header-btn:active {
      background: var(--btn-active);
    }

    /* Token Progress Tracker */
    .token-wrapper {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .token-mode-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .token-row {
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }

    .token {
      flex: 1;
      aspect-ratio: 1;
      max-width: 32px;
      border-radius: 4px; /* Wordle tile inspired border-radius */
      background: var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .token.filled {
      background: var(--accent);
      color: #ffffff;
      transform: scale(1.1);
      box-shadow: 0 2px 6px rgba(181, 159, 59, 0.4);
    }

    /* Game Play Area */
    .game-area {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .place-labels {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0 16px;
    }

    /* Interactive Number Row */
    .number-card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.25s ease, background-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .number-card:active:not(.disabled) {
      transform: scale(0.98);
      background: var(--btn-active);
    }

    .number-card.highlight-winner {
      border-color: var(--same-green);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .digit-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      text-align: center;
    }

    /* Digit Cells */
    .digit-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.3rem;
      font-weight: 800;
      border-radius: 4px;
      padding: 6px 0;
      color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease, transform 0.25s ease;
    }

    /* Evaluate Visual State Highlights based on user response */
    .digit-cell.same {
      background-color: var(--same-green) !important;
      color: #ffffff !important;
    }

    .digit-cell.different {
      background-color: var(--diff-red) !important;
      color: #ffffff !important;
      transform: scale(1.12);
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .digit-cell.white {
      color: var(--faded-text) !important;
      background-color: transparent !important;
    }

    /* Centered Equals Bar */
    .equal-divider {
      background: var(--card-bg);
      border: 2px dashed var(--divider-dashed);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .equal-divider:active:not(.disabled) {
      transform: scale(0.98);
      background: var(--btn-active);
    }

    .equal-divider.highlight-winner {
      border-color: var(--same-green);
      color: var(--same-green);
    }

    /* Pedagogical Banner */
    .explanation-panel {
      min-height: 72px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.45;
      font-weight: 600;
    }

    .next-btn {
      width: 100%;
      padding: 16px;
      background: var(--same-green);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 12px rgba(83, 141, 78, 0.3);
    }

    .next-btn:active {
      transform: translateY(1.5px);
    }

    /* Settings Modal overlay & card layout */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text);
      width: 100%;
      max-width: 390px;
      border-radius: 18px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .form-group select, .form-group textarea {
      padding: 10px;
      border-radius: 8px;
      background: var(--bg);
      border: 1.5px solid var(--border-color);
      color: var(--text);
      font-size: 0.95rem;
    }

    .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-weight: 750;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Place Value</h1>
    <div class="top-controls">
      <button class="header-btn" id="themeToggle" aria-label="Toggle display view">🌓 Theme</button>
      <button class="header-btn" id="openSettings">⚙️ Settings</button>
    </div>
  </header>

  <!-- Progress Tracker Row -->
  <div class="token-wrapper">
    <div class="token-mode-label">
      <span id="trackerModeText">Mode: 10 Total Successes</span>
      <span id="trackerCountText">0 / 10</span>
    </div>
    <div class="token-row" id="tokenRow"></div>
  </div>

  <div class="game-area">
    <!-- Place Value Labeling guides -->
    <div class="place-labels">
      <span>Ten-Th</span>
      <span>Thous</span>
      <span>Hund</span>
      <span>Tens</span>
      <span>Ones</span>
    </div>

    <!-- Interactive Top Number Option -->
    <div class="number-card" id="cardA">
      <div class="card-meta">
        <span>Number A</span>
        <span>Tap if Greater 👆</span>
      </div>
      <div class="digit-row" id="digitsA"></div>
    </div>

    <!-- Tie breaker Equals option bar -->
    <div class="equal-divider" id="btnEqual">
      Numbers are Equal (=)
    </div>

    <!-- Interactive Bottom Number Option -->
    <div class="number-card" id="cardB">
      <div class="card-meta">
        <span>Number B</span>
        <span>Tap if Greater 👆</span>
      </div>
      <div class="digit-row" id="digitsB"></div>
    </div>

    <!-- Active instructional coach banner -->
    <div class="explanation-panel" id="explanation">
      Tap the number that is greater, or tap the middle bar if they are equal!
    </div>

    <button class="next-btn" id="nextBtn">Next Round ➔</button>
  </div>

  <!-- Settings overlay Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <h2 style="font-size: 1.25rem; font-weight: 800; text-transform: uppercase;">Settings & Modes</h2>

      <!-- Success Condition System Selection -->
      <div class="form-group">
        <label for="tokenModeSelect">Goal & Token Rule:</label>
        <select id="tokenModeSelect">
          <option value="total">10 Total Successes (Cumulative)</option>
          <option value="streak">10 Continuous Successes (Reset on Mistake)</option>
        </select>
      </div>

      <!-- Problem Generator Setting -->
      <div class="form-group">
        <label for="modeSelect">Number Source:</label>
        <select id="modeSelect">
          <option value="random">Random Practice (Guided Difficulty)</option>
          <option value="preset">Parent Preset Queue</option>
        </select>
      </div>

      <!-- Textarea option based on queue preference -->
      <div class="form-group" id="presetGroup" style="display: none;">
        <label for="presetInput">Custom Pairs (Two 5-digit numbers per line):</label>
        <textarea id="presetInput" rows="5" placeholder="54321, 54299&#10;80123, 80123&#10;39400, 39500"></textarea>
      </div>

      <div class="modal-actions">
        <button style="background: var(--border-color); color: var(--text);" id="closeSettings">Cancel</button>
        <button style="background: var(--same-green); color: #ffffff;" id="saveSettings">Save & Restart</button>
      </div>
    </div>
  </div>

  <script>
    const PLACE_NAMES = ["Ten-Thousands", "Thousands", "Hundreds", "Tens", "Ones"];

    let tokens = 0;
    let tokenMode = 'total'; // 'total' | 'streak'
    let numMode = 'random';  // 'random' | 'preset'
    let presetQueue = [];
    let currentPair = { a: "00000", b: "00000" };
    let answered = false;

    // DOM selectors
    const digitsAContainer = document.getElementById('digitsA');
    const digitsBContainer = document.getElementById('digitsB');
    const cardA = document.getElementById('cardA');
    const cardB = document.getElementById('cardB');
    const btnEqual = document.getElementById('btnEqual');
    const tokenRow = document.getElementById('tokenRow');
    const trackerModeText = document.getElementById('trackerModeText');
    const trackerCountText = document.getElementById('trackerCountText');
    const explanation = document.getElementById('explanation');
    const nextBtn = document.getElementById('nextBtn');
    const settingsModal = document.getElementById('settingsModal');
    const modeSelect = document.getElementById('modeSelect');
    const tokenModeSelect = document.getElementById('tokenModeSelect');
    const presetGroup = document.getElementById('presetGroup');
    const presetInput = document.getElementById('presetInput');
    const themeToggle = document.getElementById('themeToggle');

    // Theme Management (Supports Saving in Local Browser Storage)
    function initializeTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    }

    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });

    function renderTokens() {
      tokenRow.innerHTML = '';
      for (let i = 0; i < 10; i++) {
        const t = document.createElement('div');
        t.className = 'token' + (i < tokens ? ' filled' : '');
        t.textContent = i < tokens ? '★' : (i + 1);
        tokenRow.appendChild(t);
      }
      trackerCountText.textContent = `${tokens} / 10`;
      trackerModeText.textContent = tokenMode === 'total' 
        ? '10 Total Successes' 
        : '10 Continuous (Streak)';
    }

    function getRandom5Digit() {
      return Math.floor(10000 + Math.random() * 90000).toString();
    }

    // Generator prioritizing adjacent place comparison
    function generatePedagogicalPair() {
      const matchPrefixLen = Math.floor(Math.random() * 5); 
      let base = getRandom5Digit();
      let a = base;
      let b = base.substring(0, matchPrefixLen);

      if (matchPrefixLen === 5) {
        return { a: base, b: base };
      }

      let diffDigitA = parseInt(base[matchPrefixLen]);
      let diffDigitB;
      do {
        diffDigitB = Math.floor(Math.random() * 10);
      } while (diffDigitB === diffDigitA);

      b += diffDigitB;

      while (b.length < 5) {
        b += Math.floor(Math.random() * 10).toString();
      }

      return { a, b };
    }

    function loadNextPair() {
      if (numMode === 'preset' && presetQueue.length > 0) {
        currentPair = presetQueue.shift();
      } else {
        currentPair = generatePedagogicalPair();
      }
      renderNumbers();
    }

    function renderNumbers() {
      answered = false;
      digitsAContainer.innerHTML = '';
      digitsBContainer.innerHTML = '';
      
      cardA.classList.remove('highlight-winner', 'disabled');
      cardB.classList.remove('highlight-winner', 'disabled');
      btnEqual.classList.remove('highlight-winner', 'disabled');

      for (let i = 0; i < 5; i++) {
        const cellA = document.createElement('div');
        cellA.className = 'digit-cell';
        cellA.id = `a-${i}`;
        cellA.textContent = currentPair.a[i];
        digitsAContainer.appendChild(cellA);

        const cellB = document.createElement('div');
        cellB.className = 'digit-cell';
        cellB.id = `b-${i}`;
        cellB.textContent = currentPair.b[i];
        digitsBContainer.appendChild(cellB);
      }

      nextBtn.style.display = 'none';
      explanation.innerHTML = 'Compare from left to right.<br>Tap the greater number!';
      explanation.style.color = 'var(--text)';
    }

    function handleChoice(userChoice) {
      if (answered) return;
      answered = true;

      cardA.classList.add('disabled');
      cardB.classList.add('disabled');
      btnEqual.classList.add('disabled');

      const valA = parseInt(currentPair.a, 10);
      const valB = parseInt(currentPair.b, 10);
      let correctChoice = 'equal';
      if (valA > valB) correctChoice = 'A';
      else if (valB > valA) correctChoice = 'B';

      const isCorrect = userChoice === correctChoice;

      // Color coding & evaluation sequence
      let decisionIndex = -1;
      for (let i = 0; i < 5; i++) {
        const cellA = document.getElementById(`a-${i}`);
        const cellB = document.getElementById(`b-${i}`);

        if (currentPair.a[i] === currentPair.b[i]) {
          cellA.classList.add('same');
          cellB.classList.add('same');
        } else {
          cellA.classList.add('different');
          cellB.classList.add('different');
          decisionIndex = i;

          for (let j = i + 1; j < 5; j++) {
            document.getElementById(`a-${j}`).classList.add('white');
            document.getElementById(`b-${j}`).classList.add('white');
          }
          break;
        }
      }

      if (correctChoice === 'A') cardA.classList.add('highlight-winner');
      else if (correctChoice === 'B') cardB.classList.add('highlight-winner');
      else btnEqual.classList.add('highlight-winner');

      if (isCorrect) {
        tokens++;
      } else {
        if (tokenMode === 'streak') {
          tokens = 0; // Reset continuous streak
        }
      }
      renderTokens();

      // Instructional coach response based on decision-making placement
      if (decisionIndex !== -1) {
        const place = PLACE_NAMES[decisionIndex];
        const dA = currentPair.a[decisionIndex];
        const dB = currentPair.b[decisionIndex];
        const comp = dA > dB ? `${dA} > ${dB}` : `${dB} > ${dA}`;

        if (isCorrect) {
          explanation.innerHTML = `🎉 <b>Correct!</b> Look at the <b>${place}</b> place (red): ${comp}. Digits to the right no longer matter!`;
          explanation.style.color = 'var(--same-green)';
        } else {
          const resetNote = (tokenMode === 'streak') ? '<br>(Streak reset back to 0)' : '';
          explanation.innerHTML = `❌ <b>Not quite!</b> Look at the <b>${place}</b> place (red): ${comp}.${resetNote}`;
          explanation.style.color = 'var(--diff-red)';
        }
      } else {
        if (isCorrect) {
          explanation.innerHTML = `🎉 <b>Correct!</b> All digits are green, so both numbers are equal!`;
          explanation.style.color = 'var(--same-green)';
        } else {
          const resetNote = (tokenMode === 'streak') ? '<br>(Streak reset back to 0)' : '';
          explanation.innerHTML = `❌ Every single place matches, making them equal!${resetNote}`;
          explanation.style.color = 'var(--diff-red)';
        }
      }

      if (tokens >= 10) {
        explanation.innerHTML = `🏆 <b>Splendid!</b> You completed 10 successful rounds!`;
        nextBtn.textContent = 'Play Again';
        tokens = 0;
      } else {
        nextBtn.textContent = 'Next Round ➔';
      }

      nextBtn.style.display = 'block';
    }

    // Direct element event handlers
    cardA.addEventListener('click', () => handleChoice('A'));
    cardB.addEventListener('click', () => handleChoice('B'));
    btnEqual.addEventListener('click', () => handleChoice('equal'));
    nextBtn.addEventListener('click', loadNextPair);

    // Dialog configuration listeners
    document.getElementById('openSettings').addEventListener('click', () => {
      settingsModal.classList.add('active');
    });

    document.getElementById('closeSettings').addEventListener('click', () => {
      settingsModal.classList.remove('active');
    });

    modeSelect.addEventListener('change', (e) => {
      presetGroup.style.display = e.target.value === 'preset' ? 'flex' : 'none';
    });

    document.getElementById('saveSettings').addEventListener('click', () => {
      numMode = modeSelect.value;
      tokenMode = tokenModeSelect.value;

      if (numMode === 'preset') {
        const rawLines = presetInput.value.split('\n');
        presetQueue = [];
        rawLines.forEach(line => {
          const parts = line.split(',').map(s => s.trim().replace(/\D/g, ''));
          if (parts.length === 2 && parts[0].length === 5 && parts[1].length === 5) {
            presetQueue.push({ a: parts[0], b: parts[1] });
          }
        });
        if (presetQueue.length === 0) {
          alert('Please enter at least one valid line containing two 5-digit numbers separated by a comma.');
          return;
        }
      }

      tokens = 0;
      renderTokens();
      settingsModal.classList.remove('active');
      loadNextPair();
    });

    // Start Up setup
    initializeTheme();
    renderTokens();
    loadNextPair();
  </script>
</body>
</html>
