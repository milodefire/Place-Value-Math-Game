<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mr. Milo Toolbox - Place Value Duel</title>
  <style>
    :root {
      /* Dark Theme (Wordle inspired) */
      --bg: #121213;
      --card-bg: #1a1a1c;
      --border-color: #3a3a3c;
      --text: #ffffff;
      --text-muted: #818384;
      --faded-text: #565758;
      
      --same-green: #538d4e;
      --diff-red: #b53737;
      --accent: #b59f3b;
      --btn-active: #2a2a2c;
      
      --divider-dashed: #3a3a3c;
      --panel-bg: #1e1e20;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --faded-text: #cbd5e1;

      --same-green: #6aaa64;
      --diff-red: #ea580c;
      --accent: #c9b458;
      --btn-active: #f1f5f9;

      --divider-dashed: #cbd5e1;
      --panel-bg: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      touch-action: manipulation;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      width: 100%;
      max-width: 460px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
    }

    .brand-tag {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 850;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .top-controls {
      display: flex;
      gap: 6px;
    }

    .header-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .header-btn:active {
      background: var(--btn-active);
    }

    /* Token Progress Tracker */
    .token-wrapper {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .token-mode-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .token-row {
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }

    .token {
      flex: 1;
      aspect-ratio: 1;
      max-width: 32px;
      border-radius: 4px;
      background: var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .token.filled {
      background: var(--accent);
      color: #ffffff;
      transform: scale(1.1);
      box-shadow: 0 2px 6px rgba(181, 159, 59, 0.4);
    }

    /* Game Play Area */
    .game-area {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .place-labels {
      display: grid;
      gap: 4px;
      text-align: center;
      font-size: 0.62rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 0 12px;
    }

    /* Interactive Number Row */
    .number-card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.25s ease, background-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .number-card:active:not(.disabled) {
      transform: scale(0.98);
      background: var(--btn-active);
    }

    .number-card.highlight-winner {
      border-color: var(--same-green);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .digit-row {
      display: grid;
      gap: 4px;
      width: 100%;
      text-align: center;
    }

    /* Digit Cells */
    .digit-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      border-radius: 4px;
      padding: 4px 0;
      color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease, transform 0.25s ease;
    }

    /* Responsive font scale based on digit count */
    .digits-2 .digit-cell, .digits-3 .digit-cell { font-size: 2.6rem; }
    .digits-4 .digit-cell, .digits-5 .digit-cell { font-size: 2.2rem; }
    .digits-6 .digit-cell { font-size: 1.85rem; }
    .digits-7 .digit-cell { font-size: 1.6rem; }
    .digits-8 .digit-cell { font-size: 1.4rem; }

    /* Post-comparison colors */
    .digit-cell.same {
      background-color: var(--same-green) !important;
      color: #ffffff !important;
    }

    .digit-cell.different {
      background-color: var(--diff-red) !important;
      color: #ffffff !important;
      transform: scale(1.1);
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .digit-cell.white {
      color: var(--faded-text) !important;
      background-color: transparent !important;
    }

    /* Centered Equals Bar */
    .equal-divider {
      background: var(--card-bg);
      border: 2px dashed var(--divider-dashed);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .equal-divider:active:not(.disabled) {
      transform: scale(0.98);
      background: var(--btn-active);
    }

    .equal-divider.highlight-winner {
      border-color: var(--same-green);
      color: var(--same-green);
    }

    /* Instructional Coach Banner */
    .explanation-panel {
      min-height: 64px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 0.9rem;
      line-height: 1.4;
      font-weight: 600;
    }

    .next-btn {
      width: 100%;
      padding: 14px;
      background: var(--same-green);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 12px rgba(83, 141, 78, 0.3);
    }

    .next-btn:active {
      transform: translateY(1.5px);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text);
      width: 100%;
      max-width: 390px;
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .form-group select, .form-group textarea {
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--bg);
      border: 1.5px solid var(--border-color);
      color: var(--text);
      font-size: 0.9rem;
    }

    .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .modal-actions button {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      font-weight: 750;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <span class="brand-tag">Mr. Milo Toolbox</span>
      <h1>Place Value Duel</h1>
    </div>
    <div class="top-controls">
      <button class="header-btn" id="themeToggle">🌓 Theme</button>
      <button class="header-btn" id="openSettings">⚙️ Settings</button>
    </div>
  </header>

  <!-- Progress Tracker -->
  <div class="token-wrapper">
    <div class="token-mode-label">
      <span id="trackerModeText">Mode: 10 Total Successes</span>
      <span id="trackerCountText">0 / 10</span>
    </div>
    <div class="token-row" id="tokenRow"></div>
  </div>

  <div class="game-area">
    <!-- Place Value Header Columns -->
    <div class="place-labels" id="placeLabels"></div>

    <!-- Number A Card -->
    <div class="number-card" id="cardA">
      <div class="card-meta">
        <span>Number 1</span>
        <span>Tap if Greater 👆</span>
      </div>
      <div class="digit-row" id="digitsA"></div>
    </div>

    <!-- Equal Divider Bar -->
    <div class="equal-divider" id="btnEqual">
      Numbers are Equal (=)
    </div>

    <!-- Number B Card -->
    <div class="number-card" id="cardB">
      <div class="card-meta">
        <span>Number 2</span>
        <span>Tap if Greater 👆</span>
      </div>
      <div class="digit-row" id="digitsB"></div>
    </div>

    <!-- Live Feedback Panel -->
    <div class="explanation-panel" id="explanation">
      Tap the number that is greater, or tap the middle bar if they are equal!
    </div>

    <button class="next-btn" id="nextBtn">Next Round ➔</button>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div>
        <div class="brand-tag">Mr. Milo Toolbox</div>
        <h2 style="font-size: 1.15rem; font-weight: 800; text-transform: uppercase;">Game Settings</h2>
      </div>

      <!-- Digit Count Selector (2 to 8 places) -->
      <div class="form-group">
        <label for="digitCountSelect">Number of Places (Digits):</label>
        <select id="digitCountSelect">
          <option value="2">2 Digits (Tens)</option>
          <option value="3">3 Digits (Hundreds)</option>
          <option value="4">4 Digits (Thousands)</option>
          <option value="5" selected>5 Digits (Ten-Thousands)</option>
          <option value="6">6 Digits (Hundred-Thousands)</option>
          <option value="7">7 Digits (Millions)</option>
          <option value="8">8 Digits (Ten-Millions)</option>
        </select>
      </div>

      <!-- Token Mode Selector -->
      <div class="form-group">
        <label for="tokenModeSelect">Goal & Token Rule:</label>
        <select id="tokenModeSelect">
          <option value="total">10 Total Successes (Cumulative)</option>
          <option value="streak">10 Continuous Successes (Reset on Mistake)</option>
        </select>
      </div>

      <!-- Sound Toggle -->
      <div class="form-group">
        <label for="soundSelect">Audio Effects:</label>
        <select id="soundSelect">
          <option value="on">Sound ON (Ding / Beep)</option>
          <option value="off">Sound OFF (Muted)</option>
        </select>
      </div>

      <!-- Problem Generator Mode -->
      <div class="form-group">
        <label for="modeSelect">Number Source:</label>
        <select id="modeSelect">
          <option value="random">Random Practice (Guided Difficulty)</option>
          <option value="preset">Parent Preset Queue</option>
        </select>
      </div>

      <div class="form-group" id="presetGroup" style="display: none;">
        <label for="presetInput" id="presetLabel">Custom Pairs (Two numbers per line):</label>
        <textarea id="presetInput" rows="5" placeholder="54321, 54299&#10;80123, 80123"></textarea>
      </div>

      <div class="modal-actions">
        <button style="background: var(--border-color); color: var(--text);" id="closeSettings">Cancel</button>
        <button style="background: var(--same-green); color: #ffffff;" id="saveSettings">Save & Restart</button>
      </div>
    </div>
  </div>

  <script>
    // Master place value tables (from 8 down to 1)
    const ALL_PLACE_NAMES = [
      "Ten-Millions",
      "Millions",
      "Hundred-Thousands",
      "Ten-Thousands",
      "Thousands",
      "Hundreds",
      "Tens",
      "Ones"
    ];

    const ALL_SHORT_NAMES = [
      "Ten-M",
      "Mill",
      "Hun-Th",
      "Ten-Th",
      "Thous",
      "Hund",
      "Tens",
      "Ones"
    ];

    let numPlaces = 5;       // Configurable 2 to 8
    let tokens = 0;
    let tokenMode = 'total'; // 'total' | 'streak'
    let soundEnabled = true;
    let numMode = 'random';  // 'random' | 'preset'
    let presetQueue = [];
    let currentPair = { a: "", b: "" };
    let answered = false;

    // Web Audio Synthesizer (Zero asset dependencies)
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playDing() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        // Two-tone bell harmonic (E6 = ~1318 Hz, G#6 = ~1661 Hz)
        [1318.5, 1661.2].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);

          gain.gain.setValueAtTime(0.18, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.45);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.5);
        });
      } catch (e) {
        console.warn('Audio playback blocked or unavailable', e);
      }
    }

    function playBeep() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        // Warning buzzer sound (sawtooth wave at 160Hz)
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);

        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.36);
      } catch (e) {
        console.warn('Audio playback blocked or unavailable', e);
      }
    }

    // DOM selectors
    const placeLabelsContainer = document.getElementById('placeLabels');
    const digitsAContainer = document.getElementById('digitsA');
    const digitsBContainer = document.getElementById('digitsB');
    const cardA = document.getElementById('cardA');
    const cardB = document.getElementById('cardB');
    const btnEqual = document.getElementById('btnEqual');
    const tokenRow = document.getElementById('tokenRow');
    const trackerModeText = document.getElementById('trackerModeText');
    const trackerCountText = document.getElementById('trackerCountText');
    const explanation = document.getElementById('explanation');
    const nextBtn = document.getElementById('nextBtn');
    const settingsModal = document.getElementById('settingsModal');
    const digitCountSelect = document.getElementById('digitCountSelect');
    const modeSelect = document.getElementById('modeSelect');
    const tokenModeSelect = document.getElementById('tokenModeSelect');
    const soundSelect = document.getElementById('soundSelect');
    const presetGroup = document.getElementById('presetGroup');
    const presetInput = document.getElementById('presetInput');
    const presetLabel = document.getElementById('presetLabel');
    const themeToggle = document.getElementById('themeToggle');

    function getCurrentPlaceNames() {
      return ALL_PLACE_NAMES.slice(8 - numPlaces);
    }

    function getCurrentShortNames() {
      return ALL_SHORT_NAMES.slice(8 - numPlaces);
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    }

    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });

    function renderTokens() {
      tokenRow.innerHTML = '';
      for (let i = 0; i < 10; i++) {
        const t = document.createElement('div');
        t.className = 'token' + (i < tokens ? ' filled' : '');
        t.textContent = i < tokens ? '★' : (i + 1);
        tokenRow.appendChild(t);
      }
      trackerCountText.textContent = `${tokens} / 10`;
      trackerModeText.textContent = tokenMode === 'total' 
        ? '10 Total Successes' 
        : '10 Continuous (Streak)';
    }

    function getRandomNDigit(n) {
      const min = Math.pow(10, n - 1);
      const max = Math.pow(10, n) - 1;
      return Math.floor(min + Math.random() * (max - min + 1)).toString();
    }

    function generatePedagogicalPair() {
      const matchPrefixLen = Math.floor(Math.random() * (numPlaces + 1)); 
      const base = getRandomNDigit(numPlaces);

      if (matchPrefixLen === numPlaces) {
        return { a: base, b: base };
      }

      let a = base;
      let b = base.substring(0, matchPrefixLen);

      let diffDigitA = parseInt(base[matchPrefixLen]);
      let diffDigitB;
      do {
        diffDigitB = Math.floor(Math.random() * 10);
      } while (diffDigitB === diffDigitA);

      b += diffDigitB;

      while (b.length < numPlaces) {
        b += Math.floor(Math.random() * 10).toString();
      }

      return { a, b };
    }

    function loadNextPair() {
      if (numMode === 'preset' && presetQueue.length > 0) {
        currentPair = presetQueue.shift();
      } else {
        currentPair = generatePedagogicalPair();
      }
      renderNumbers();
    }

    function renderNumbers() {
      answered = false;
      digitsAContainer.innerHTML = '';
      digitsBContainer.innerHTML = '';
      placeLabelsContainer.innerHTML = '';

      cardA.classList.remove('highlight-winner', 'disabled');
      cardB.classList.remove('highlight-winner', 'disabled');
      btnEqual.classList.remove('highlight-winner', 'disabled');

      const gridTemplate = `repeat(${numPlaces}, 1fr)`;
      placeLabelsContainer.style.gridTemplateColumns = gridTemplate;
      digitsAContainer.style.gridTemplateColumns = gridTemplate;
      digitsBContainer.style.gridTemplateColumns = gridTemplate;

      document.body.className = `digits-${numPlaces}`;

      const shortNames = getCurrentShortNames();
      shortNames.forEach(name => {
        const span = document.createElement('span');
        span.textContent = name;
        placeLabelsContainer.appendChild(span);
      });

      for (let i = 0; i < numPlaces; i++) {
        const cellA = document.createElement('div');
        cellA.className = 'digit-cell';
        cellA.id = `a-${i}`;
        cellA.textContent = currentPair.a[i];
        digitsAContainer.appendChild(cellA);

        const cellB = document.createElement('div');
        cellB.className = 'digit-cell';
        cellB.id = `b-${i}`;
        cellB.textContent = currentPair.b[i];
        digitsBContainer.appendChild(cellB);
      }

      nextBtn.style.display = 'none';
      explanation.innerHTML = 'Compare from left to right.<br>Tap the greater number!';
      explanation.style.color = 'var(--text)';
    }

    function handleChoice(userChoice) {
      if (answered) return;
      answered = true;

      cardA.classList.add('disabled');
      cardB.classList.add('disabled');
      btnEqual.classList.add('disabled');

      const valA = BigInt(currentPair.a);
      const valB = BigInt(currentPair.b);

      let correctChoice = 'equal';
      if (valA > valB) correctChoice = 'A';
      else if (valB > valA) correctChoice = 'B';

      const isCorrect = userChoice === correctChoice;

      if (isCorrect) {
        playDing();
      } else {
        playBeep();
      }

      let decisionIndex = -1;
      for (let i = 0; i < numPlaces; i++) {
        const cellA = document.getElementById(`a-${i}`);
        const cellB = document.getElementById(`b-${i}`);

        if (currentPair.a[i] === currentPair.b[i]) {
          cellA.classList.add('same');
          cellB.classList.add('same');
        } else {
          cellA.classList.add('different');
          cellB.classList.add('different');
          decisionIndex = i;

          for (let j = i + 1; j < numPlaces; j++) {
            document.getElementById(`a-${j}`).classList.add('white');
            document.getElementById(`b-${j}`).classList.add('white');
          }
          break;
        }
      }

      if (correctChoice === 'A') cardA.classList.add('highlight-winner');
      else if (correctChoice === 'B') cardB.classList.add('highlight-winner');
      else btnEqual.classList.add('highlight-winner');

      if (isCorrect) {
        tokens++;
      } else {
        if (tokenMode === 'streak') {
          tokens = 0;
        }
      }
      renderTokens();

      const placeNames = getCurrentPlaceNames();

      if (decisionIndex !== -1) {
        const place = placeNames[decisionIndex];
        const dA = currentPair.a[decisionIndex];
        const dB = currentPair.b[decisionIndex];
        const comp = dA > dB ? `${dA} > ${dB}` : `${dB} > ${dA}`;

        if (isCorrect) {
          explanation.innerHTML = `🎉 <b>Correct!</b> Look at the <b>${place}</b> place (red): ${comp}. Digits to the right no longer matter!`;
          explanation.style.color = 'var(--same-green)';
        } else {
          const resetNote = (tokenMode === 'streak') ? '<br>(Streak reset back to 0)' : '';
          explanation.innerHTML = `❌ <b>Not quite!</b> Look at the <b>${place}</b> place (red): ${comp}.${resetNote}`;
          explanation.style.color = 'var(--diff-red)';
        }
      } else {
        if (isCorrect) {
          explanation.innerHTML = `🎉 <b>Correct!</b> All digits are green, so both numbers are equal!`;
          explanation.style.color = 'var(--same-green)';
        } else {
          const resetNote = (tokenMode === 'streak') ? '<br>(Streak reset back to 0)' : '';
          explanation.innerHTML = `❌ Every single place matches, making them equal!${resetNote}`;
          explanation.style.color = 'var(--diff-red)';
        }
      }

      if (tokens >= 10) {
        explanation.innerHTML = `🏆 <b>Splendid!</b> You completed 10 successful rounds!`;
        nextBtn.textContent = 'Play Again';
        tokens = 0;
      } else {
        nextBtn.textContent = 'Next Round ➔';
      }

      nextBtn.style.display = 'block';
    }

    cardA.addEventListener('click', () => handleChoice('A'));
    cardB.addEventListener('click', () => handleChoice('B'));
    btnEqual.addEventListener('click', () => handleChoice('equal'));
    nextBtn.addEventListener('click', loadNextPair);

    // Settings Modal Handlers
    document.getElementById('openSettings').addEventListener('click', () => {
      digitCountSelect.value = numPlaces.toString();
      tokenModeSelect.value = tokenMode;
      soundSelect.value = soundEnabled ? 'on' : 'off';
      modeSelect.value = numMode;
      presetLabel.textContent = `Custom Pairs (Two ${numPlaces}-digit numbers per line):`;
      settingsModal.classList.add('active');
    });

    document.getElementById('closeSettings').addEventListener('click', () => {
      settingsModal.classList.remove('active');
    });

    modeSelect.addEventListener('change', (e) => {
      presetGroup.style.display = e.target.value === 'preset' ? 'flex' : 'none';
    });

    digitCountSelect.addEventListener('change', (e) => {
      presetLabel.textContent = `Custom Pairs (Two ${e.target.value}-digit numbers per line):`;
    });

    document.getElementById('saveSettings').addEventListener('click', () => {
      getAudioContext();

      numPlaces = parseInt(digitCountSelect.value, 10);
      numMode = modeSelect.value;
      tokenMode = tokenModeSelect.value;
      soundEnabled = soundSelect.value === 'on';

      if (numMode === 'preset') {
        const rawLines = presetInput.value.split('\n');
        presetQueue = [];
        rawLines.forEach(line => {
          const parts = line.split(',').map(s => s.trim().replace(/\D/g, ''));
          if (parts.length === 2 && parts[0].length === numPlaces && parts[1].length === numPlaces) {
            presetQueue.push({ a: parts[0], b: parts[1] });
          }
        });
        if (presetQueue.length === 0) {
          alert(`Please enter at least one valid line containing two ${numPlaces}-digit numbers separated by a comma.`);
          return;
        }
      }

      tokens = 0;
      renderTokens();
      settingsModal.classList.remove('active');
      loadNextPair();
    });

    // Start setup
    initializeTheme();
    renderTokens();
    loadNextPair();
  </script>
</body>
</html>
